<div class="backdrop" role="presentation" (click)="backdrop($event)" (keydown.escape)="close()"><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><header><div><h2 id="drawer-title">إضافة تصنيف</h2><p>أضف تصنيفًا جديدًا لتنظيم منتجات متجرك.</p></div><button type="button" aria-label="إغلاق" (click)="close()"><svg lucideX></svg></button></header><form [formGroup]="form" (ngSubmit)="save()"><div class="fields"><label>اسم التصنيف <b>*</b><input formControlName="name" placeholder="مثال: أسمدة عضوية">@if(form.controls.name.touched&&form.controls.name.invalid){<small class="error">اسم التصنيف مطلوب</small>}</label><label>التصنيف الرئيسي<select formControlName="parentId"><option value="">بدون تصنيف رئيسي</option>@for(parent of parents();track parent.id){<option [value]="parent.id">{{parent.name}}</option>}</select><small>اتركه بدون اختيار لإنشاء تصنيف رئيسي.</small></label><label>الرابط المختصر<input dir="ltr" formControlName="slug" placeholder="organic-fertilizers"><small>يُنشأ تلقائيًا ويمكن تعديله.</small></label><label>صورة التصنيف<input #image hidden type="file" accept="image/png,image/jpeg" (change)="selectImage($event)"><button class="upload" type="button" (click)="choose(image)">@if(imageUrl();as url){<img [src]="url" alt="معاينة صورة التصنيف">}@else{<svg lucideImagePlus></svg><span>اسحب الصورة هنا أو اختر ملفًا<small>PNG أو JPG بحد أقصى 2 MB</small></span>}</button></label><label>وصف مختصر (اختياري)<textarea rows="3" formControlName="description" placeholder="اكتب وصفًا يساعد العميل على فهم التصنيف."></textarea></label><div class="row"><label>ترتيب الظهور<input type="number" min="1" formControlName="order"></label><label class="switch-row">ظاهر في المتجر<input type="checkbox" formControlName="visible"><span></span></label></div><p class="hint"><svg lucideInfo></svg>سيظهر هذا التصنيف داخل التصنيف الرئيسي المحدد في المتجر.</p></div><footer><button class="cancel" type="button" (click)="close()">إلغاء</button><button class="save" type="submit" [disabled]="saving()">{{saving()?'جارٍ الحفظ…':'حفظ التصنيف'}}</button></footer></form></aside></div>
